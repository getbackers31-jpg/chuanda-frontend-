<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#087f5b">
    <title>云說倉庫管理 v6.5</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root {
            --green: #087f5b; --green2: #0ca678; --green3: #e6fcf5;
            --blue: #1971c2; --bluebg: #e7f5ff; --orange: #e67700; --orangebg: #fff4e6;
            --red: #c92a2a; --redbg: #fff5f5; --ink: #212529; --muted: #6c757d;
            --line: #e9ecef; --bg: #f4f7f6; --white: #fff; --shadow: 0 10px 30px rgba(33,37,41,.10);
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; font-family: "Segoe UI", "Noto Sans TC", Arial, sans-serif; color: var(--ink); background: var(--bg); }
        button, input, select, textarea { font: inherit; }
        .app { width: min(100%, 560px); min-height: 100vh; margin: auto; background: var(--white); box-shadow: var(--shadow); }
        .header { position: sticky; top: 0; z-index: 10; padding: calc(14px + env(safe-area-inset-top)) 16px 12px; background: linear-gradient(135deg, var(--green), var(--green2)); color: #fff; }
        .header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .title { font-size: 20px; font-weight: 800; }
        .version-tag { margin-left:6px; padding:2px 7px; border-radius:999px; background:rgba(255,255,255,.18); font-size:10px; vertical-align:middle; }
        .subtitle { margin-top: 2px; font-size: 12px; color: rgba(255,255,255,.82); }
        .icon-btn { width: 42px; height: 42px; border: 0; border-radius: 12px; background: rgba(255,255,255,.16); color: #fff; font-size: 20px; cursor: pointer; }
        .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 14px 14px 8px; background: #fff; }
        .metric { padding: 11px 8px; border: 1px solid var(--line); border-radius: 12px; text-align: center; background: #fff; cursor: pointer; }
        .metric strong { display: block; font-size: 21px; }
        .metric span { font-size: 12px; color: var(--muted); }
        .metric.warn strong { color: var(--orange); }
        .metric.danger strong { color: var(--red); }
        .search-wrap { padding: 8px 14px; }
        .search { display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid #ced4da; border-radius: 12px; background: #fff; }
        .search input { width: 100%; padding: 12px 0; border: 0; outline: 0; background: transparent; }
        .filters { display: flex; gap: 8px; overflow-x: auto; padding: 4px 14px 12px; scrollbar-width: none; }
        .chip { flex: none; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: #495057; font-size: 13px; font-weight: 700; cursor: pointer; }
        .chip.active { border-color: var(--green); background: var(--green3); color: var(--green); }

        .recent { margin: 10px 14px 4px; border: 1px solid var(--line); border-radius: 14px; background:#fff; overflow:hidden; }
        .recent-head { display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:48px; padding:10px 12px; border:0; background:#fff; width:100%; color:var(--ink); cursor:pointer; }
        .recent-title { font-size:15px; font-weight:900; }
        .recent-subtitle { margin-top:2px; color:var(--muted); font-size:11px; text-align:left; }
        .recent-toggle { color:var(--green); font-size:12px; font-weight:900; white-space:nowrap; }
        .recent-body { padding:0 12px; border-top:1px solid var(--line); }
        .recent-body.hidden { display:none; }
        .recent-item { display:grid; grid-template-columns:4px minmax(0,1fr) auto; gap:9px; padding:12px 0; border-bottom:1px solid var(--line); }
        .recent-item:last-child { border-bottom:0; }
        .recent-accent { border-radius:99px; background:var(--blue); }
        .recent-item.purchase .recent-accent { background:var(--green2); }
        .recent-item.adjust .recent-accent { background:var(--orange); }
        .recent-item.transfer .recent-accent { background:var(--red); }
        .recent-item.return .recent-accent { background:#7048e8; }
        .recent-type { font-size:13px; font-weight:900; }
        .recent-material { margin-top:3px; font-size:13px; overflow-wrap:anywhere; }
        .recent-meta { margin-top:4px; color:var(--muted); font-size:11px; line-height:1.45; }
        .recent-qty { font-size:15px; font-weight:900; text-align:right; white-space:nowrap; }
        .recent-qty.positive { color:var(--green); }
        .recent-qty.negative { color:var(--red); }
        .recent-time { margin-top:4px; color:var(--muted); font-size:10px; text-align:right; white-space:nowrap; }
        .recent-state { padding:16px 8px; color:var(--muted); font-size:12px; text-align:center; }
        .notice { margin: 0 14px 12px; padding: 12px 13px; border-left: 4px solid var(--blue); border-radius: 10px; background: var(--bluebg); font-size: 13px; line-height: 1.55; }
        .notice strong { color: var(--blue); }
        .list { padding: 0 14px 84px; }
        .card { margin-bottom: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 15px; background: #fff; box-shadow: 0 4px 16px rgba(33,37,41,.055); cursor:pointer; transition:.15s; }
        .card:active { transform:scale(.992); }
        .card:focus-visible { outline:3px solid rgba(12,166,120,.25); outline-offset:2px; }
        .card-hint { margin-top:10px; padding-top:10px; border-top:1px solid var(--line); color:var(--green); font-size:12px; font-weight:800; text-align:right; }
        .minimum-note { margin-top:6px; color:var(--orange); font-size:12px; font-weight:800; line-height:1.4; }
        .minimum-note.normal-note { color:var(--green); }
        .card-top { display: flex; align-items: flex-start; gap: 11px; }
        .thumb { display: grid; place-items: center; flex: none; width: 52px; height: 52px; border-radius: 13px; background: linear-gradient(145deg, #edf2ff, #e7f5ff); font-size: 27px; padding: 0; overflow: hidden; }
        .meta { min-width: 0; flex: 1; }
        .name { font-weight: 800; line-height: 1.35; }
        .code { margin-top: 3px; color: var(--muted); font-size: 12px; }
        .stock { text-align: right; }
        .stock strong { display:block; font-size:23px; color:var(--green); white-space:nowrap; }
        .stock span { display:block; margin-top:3px; font-size:12px; color:var(--muted); white-space:nowrap; }
        .status { display: inline-flex; margin-top: 7px; padding: 4px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; }
        .normal { background: var(--green3); color: var(--green); }
        .low { background: var(--orangebg); color: var(--orange); }
        .empty { background: var(--redbg); color: var(--red); }
        .fab { position: fixed; right: max(18px, calc((100vw - 560px)/2 + 18px)); bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 21; width: 58px; height: 58px; border: 0; border-radius: 50%; box-shadow: 0 8px 22px rgba(8,127,91,.3); background: var(--green); color: #fff; font-size: 30px; cursor: pointer; }
        .overlay { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.52); opacity: 1; visibility: visible; transition: .2s; }
        .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .sheet { width: min(100%, 560px); max-height: 92vh; overflow: auto; border-radius: 20px 20px 0 0; background: #fff; padding-bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateY(0); transition: .2s; }
        .overlay.hidden .sheet { transform: translateY(30px); }
        .handle { width: 42px; height: 5px; margin: 10px auto; border-radius: 99px; background: #dee2e6; }
        .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 18px 13px; border-bottom: 1px solid var(--line); }
        .sheet-title { font-size: 19px; font-weight: 800; }
        .close { width: 36px; height: 36px; border: 0; border-radius: 50%; background: #f1f3f5; font-size: 20px; cursor: pointer; }
        .sheet-body { padding: 16px 18px; }
        .type-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; margin-bottom: 16px; }
        .type-btn { padding: 13px 4px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font-weight: 800; font-size: 13px; cursor: pointer; text-align: center; }
        .type-btn.active { border-color: var(--green); background: var(--green3); color: var(--green); }
        .field { margin-bottom: 14px; }
        .field label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 800; }
        .field input, .field select, .field textarea { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 10px; background: #fff; outline: 0; }
        .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(12,166,120,.12); }
        .preview { margin: 4px 0 15px; padding: 13px; border-radius: 12px; background: #f8f9fa; }
        .preview-row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 14px; }
        .preview-row.final { margin-top: 5px; padding-top: 10px; border-top: 1px solid #dee2e6; font-weight: 900; }
        .preview-row.final span:last-child { color: var(--green); }
        .submit { width: 100%; padding: 13px; border: 0; border-radius: 11px; background: var(--green); color: #fff; font-size: 16px; font-weight: 900; cursor: pointer; }
        .toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); z-index: 200; transform: translate(-50%, 130px); width: min(calc(100% - 28px), 500px); padding: 13px; border-radius: 11px; background: #1864ab; color: #fff; text-align: center; opacity: 0; transition: .2s; }
        .toast.show { transform: translate(-50%, 0); opacity: 1; }
        @media(min-width: 561px) {
            body { padding: 18px; }
            .app { border-radius: 18px; overflow: hidden; min-height: calc(100vh - 36px); }
            .sheet { margin-bottom: 18px; border-radius: 20px; }
        }

        .report-panel{margin:10px 14px 12px;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}.report-head{padding:12px 14px;border-bottom:1px solid var(--line)}.report-title{font-size:15px;font-weight:900}.report-subtitle{margin-top:3px;color:var(--muted);font-size:11px;line-height:1.45}.report-body{padding:14px}.report-range-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.report-range-btn{min-height:46px;padding:10px 8px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#495057;font-size:13px;font-weight:800;cursor:pointer}.report-range-btn.active{border-color:var(--green);background:var(--green3);color:var(--green)}.custom-range{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.custom-range.hidden{display:none}.custom-range label{display:block;margin-bottom:5px;color:var(--muted);font-size:11px;font-weight:800}.custom-range input{width:100%;min-height:44px;padding:10px;border:1px solid #ced4da;border-radius:10px;background:#fff}.report-range-text{margin-top:12px;padding:10px 12px;border-radius:10px;background:#f8f9fa;color:#495057;font-size:12px;line-height:1.5}.report-sheets{margin:12px 0;padding-left:20px;color:#495057;font-size:12px;line-height:1.65}.report-submit{width:100%;min-height:50px;padding:12px 14px;border:0;border-radius:11px;background:var(--green);color:#fff;font-size:15px;font-weight:900;cursor:pointer}.report-submit:disabled{opacity:.62;cursor:not-allowed}.report-result{display:none;margin-top:12px;padding:12px;border-radius:10px;background:var(--green3);color:var(--green);font-size:12px;line-height:1.6;overflow-wrap:anywhere}.report-result.show{display:block}.report-result.error{background:var(--redbg);color:var(--red)}@media(max-width:340px){.report-range-grid,.custom-range{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div class="app">
    <header class="header">
        <div class="header-row">
            <div>
                <div class="title">📦 云說倉庫管理 <span class="version-tag">v6.5</span></div>
                <div class="subtitle" id="userGreeting">載入中...</div>
            </div>
            <button class="icon-btn" aria-label="重新整理" onclick="initApp()">↻</button>
        </div>
    </header>

    <section class="summary">
        <button class="metric" onclick="setFilter('all')"><strong id="sumTotal">0</strong><span>總品項</span></button>
        <button class="metric warn" onclick="setFilter('low')"><strong id="sumLow">0</strong><span>庫存不足</span></button>
        <button class="metric danger" onclick="setFilter('empty')"><strong id="sumEmpty">0</strong><span>缺貨</span></button>
    </section>

    <div class="search-wrap">
        <div class="search">🔎<input id="searchInput" placeholder="搜尋材料名稱或料號" oninput="renderList()"></div>
    </div>
    
    <div class="filters">
        <button class="chip active" data-filter="all" onclick="setFilter('all')">全部</button>
        <button class="chip" data-filter="normal" onclick="setFilter('normal')">正常</button>
        <button class="chip" data-filter="low" onclick="setFilter('low')">庫存不足</button>
        <button class="chip" data-filter="empty" onclick="setFilter('empty')">缺貨</button>
    </div>


    <section class="recent" aria-labelledby="recentTitle">
        <button class="recent-head" type="button" onclick="toggleRecent()" aria-expanded="false" id="recentButton">
            <span><span class="recent-title" id="recentTitle">最近異動</span><span class="recent-subtitle" id="recentSummary">載入最近紀錄中...</span></span>
            <span class="recent-toggle" id="recentToggle">展開最近5筆</span>
        </button>
        <div class="recent-body hidden" id="recentBody"><div class="recent-state">載入中...</div></div>
    </section>


    <section class="report-panel" aria-labelledby="warehouseReportTitle">
      <div class="report-head"><div class="report-title" id="warehouseReportTitle">📊 倉庫 Excel 報表</div><div class="report-subtitle">報表會直接儲存到公司 OneDrive，不會下載到手機。</div></div>
      <div class="report-body">
        <div class="report-range-grid" role="group" aria-label="報表範圍">
          <button type="button" class="report-range-btn" data-report-range="all" onclick="selectReportRange('all')">全部紀錄</button>
          <button type="button" class="report-range-btn active" data-report-range="month" onclick="selectReportRange('month')">本月</button>
          <button type="button" class="report-range-btn" data-report-range="custom" onclick="selectReportRange('custom')">自訂日期</button>
          <button type="button" class="report-range-btn" data-report-range="current" onclick="selectReportRange('current')">目前庫存</button>
        </div>
        <div id="customRangeFields" class="custom-range hidden"><div><label for="reportStartDate">開始日期</label><input id="reportStartDate" type="date" onchange="updateReportRangeText()"></div><div><label for="reportEndDate">結束日期</label><input id="reportEndDate" type="date" onchange="updateReportRangeText()"></div></div>
        <div id="reportRangeText" class="report-range-text">正在計算報表範圍...</div>
        <ol class="report-sheets"><li>倉庫庫存總表</li><li>倉庫異動明細</li><li>案場轉撥紀錄</li><li>盤點差異</li><li>庫存警示</li></ol>
        <button id="generateReportBtn" class="report-submit" type="button" onclick="generateWarehouseReport()">產生並儲存 Excel 報表</button><div id="reportResult" class="report-result" role="status"></div>
      </div>
    </section>
    <div class="notice">
        <strong>💡 材料流向：</strong><br>
        公司倉庫送往工地請使用「領至案場」；<br>供應商直送工地請使用工程小幫手。
    </div>

    <main class="list" id="materialList">
        <div style="text-align:center; padding: 40px; color:#6c757d;">載入材料資料中...</div>
    </main>

    <button class="fab" onclick="openSheet('PURCHASE_IN')" aria-label="新增異動">＋</button>
</div>

<!-- 底部彈出異動表單 -->
<div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <section class="sheet">
        <div class="handle"></div>
        <div class="sheet-head">
            <div id="sheetTitle" class="sheet-title">選擇異動方式</div>
            <button class="close" onclick="closeSheet()" aria-label="關閉">×</button>
        </div>
        <div class="sheet-body">
            <div class="type-grid">
                <button class="type-btn active" data-type="PURCHASE_IN" onclick="chooseType(this)">➕ 採購入庫</button>
                <button class="type-btn" data-type="WAREHOUSE_ADJUSTMENT" onclick="chooseType(this)">🔄 盤點修正</button>
                <button class="type-btn" data-type="PROJECT_TRANSFER_OUT" onclick="chooseType(this)">🚚 領至案場</button>
                <button class="type-btn" data-type="PROJECT_RETURN" onclick="chooseType(this)">↩️ 案場退回</button>
            </div>
            
            <div class="field">
                <label>操作人</label>
                <input id="operatorName" placeholder="填寫後系統將記憶">
            </div>
            
            <div class="field">
                <label>材料品項</label>
                <select id="sheetMaterial" onchange="updatePreview()"><option>載入中...</option></select>
            </div>
            
            <div id="projectField" class="field" hidden>
                <label>案場</label>
                <select id="sheetProject"><option>載入中...</option></select>
            </div>
            
            <div class="field">
                <label>異動日期</label>
                <input id="transactionDate" type="date">
            </div>
            <div class="field">
                <label id="qtyLabel">本次入庫數量</label>
                <input id="qty" type="number" inputmode="decimal" min="0" step="0.1" value="" oninput="updatePreview()" placeholder="請輸入數量">
            </div>
            
            <div class="preview">
                <div class="preview-row"><span>目前倉庫</span><strong id="prevCurrent">0</strong></div>
                <div class="preview-row"><span id="changeLabel">本次入庫</span><strong id="changeValue">0</strong></div>
                <div class="preview-row final"><span>異動後倉庫</span><span id="afterValue">0</span></div>
                <div id="projectImpact" class="preview-row" hidden><span>案場材料領入</span><strong id="projImpactValue">0</strong></div>
            </div>
            
            <div class="field">
                <label>備註</label>
                <textarea id="sheetRemark" rows="2" placeholder="選填，例如：廠商送貨、開工首批領料"></textarea>
            </div>
            
            <button class="submit" id="submitBtn" onclick="submitTransaction()">確認送出</button>
        </div>
    </section>
</div>
<div id="toast" class="toast"></div>

<script>
const LIFF_ID = '2011289657-dSXS9DVe';
const API_BASE_URL = 'https://gong-cheng-linechuan-jie.onrender.com';

let materialsData = [];
let projectsData = [];
let currentFilter = 'all';
let currentType = 'PURCHASE_IN';
let currentSubmissionId = '';
let isSubmitting = false;
let currentReportRange = 'month';


function firstDayOfTaiwanMonth(){const t=getTaiwanDateString();return `${t.slice(0,7)}-01`}
function fmtReportDate(v){return v?String(v).replace(/-/g,'/'):''}
function initializeReportControls(){const t=getTaiwanDateString(),s=document.getElementById('reportStartDate'),e=document.getElementById('reportEndDate');if(s&&e){s.value=s.value||firstDayOfTaiwanMonth();e.value=e.value||t;s.max=t;e.max=t}selectReportRange(currentReportRange)}
function selectReportRange(r){currentReportRange=r;document.querySelectorAll('[data-report-range]').forEach(b=>b.classList.toggle('active',b.dataset.reportRange===r));document.getElementById('customRangeFields')?.classList.toggle('hidden',r!=='custom');updateReportRangeText()}
function updateReportRangeText(){const el=document.getElementById('reportRangeText');if(!el)return;const t=getTaiwanDateString();if(currentReportRange==='all')el.textContent='報表範圍：第一筆倉庫異動至匯出當下';else if(currentReportRange==='month')el.textContent=`報表範圍：${fmtReportDate(firstDayOfTaiwanMonth())} 至 ${fmtReportDate(t)}`;else if(currentReportRange==='current')el.textContent=`庫存快照：截至 ${fmtReportDate(t)}；不包含期間異動明細`;else{const s=document.getElementById('reportStartDate').value,e=document.getElementById('reportEndDate').value;el.textContent=s&&e?`報表範圍：${fmtReportDate(s)} 至 ${fmtReportDate(e)}`:'請選擇開始日期與結束日期'}}
async function generateWarehouseReport(){const b=document.getElementById('generateReportBtn'),box=document.getElementById('reportResult'),payload={range:currentReportRange};if(currentReportRange==='custom'){payload.startDate=document.getElementById('reportStartDate').value;payload.endDate=document.getElementById('reportEndDate').value;if(!payload.startDate||!payload.endDate){box.className='report-result show error';box.textContent='請選擇開始日期與結束日期。';return}if(payload.startDate>payload.endDate){box.className='report-result show error';box.textContent='開始日期不可晚於結束日期。';return}}const token=liff.isLoggedIn()?liff.getIDToken():null;if(!token){try{restartLineLogin()}catch(e){box.className='report-result show error';box.textContent=e.message}return}b.disabled=true;b.textContent='⏳ 正在產生並儲存報表...';box.className='report-result show';box.textContent='正在整理資料，完成後會直接存入 OneDrive。';try{const r=await fetch(`${API_BASE_URL}/api/warehouse/export-excel`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify(payload)}),txt=await r.text();let data={};try{data=txt?JSON.parse(txt):{}}catch(_){throw new Error(`API 回傳格式錯誤（HTTP ${r.status}）`)}if(r.status===401){restartLineLogin();return}if(!r.ok||!data.success)throw new Error(data.error||data.message||`報表產生失敗（HTTP ${r.status}）`);clearAuthRetryFlag();box.className='report-result show';box.innerHTML=`✅ Excel 報表已儲存至 OneDrive<br><strong>${escapeHtml(data.fileName||'')}</strong><br>${escapeHtml(data.folderPath||'')}`;showToast('✅ 倉庫 Excel 報表已儲存')}catch(e){box.className='report-result show error';box.textContent=`產生報表失敗：${e.message}`}finally{b.disabled=false;b.textContent='產生並儲存 Excel 報表'}}

function createSubmissionId() {
    return window.crypto?.randomUUID ? window.crypto.randomUUID() : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
}
function getTaiwanDateString() {
    return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
}
async function initApp() {
    showToast("資料同步中...");
    initializeReportControls();
    const dateInput = document.getElementById('transactionDate');
    const today = getTaiwanDateString();
    dateInput.value = dateInput.value || today;
    dateInput.max = today;
    
    const savedName = localStorage.getItem('warehouseOperatorName');
    if (savedName) {
        document.getElementById('operatorName').value = savedName;
    }

    try {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            document.getElementById('userGreeting').textContent = `哈囉，${profile.displayName}`;
            if (!savedName) {
                document.getElementById('operatorName').value = profile.displayName;
            }
        } else {
            liff.login();
            return;
        }
    } catch (e) {
        console.error("LIFF 錯誤", e);
        document.getElementById('userGreeting').textContent = `庫存管理系統`;
    }

    try {
        const [invRes, projRes] = await Promise.all([
            fetch(`${API_BASE_URL}/api/warehouse/inventory`),
            fetch(`${API_BASE_URL}/api/projects`)
        ]);

        const invJson = await invRes.json();
        const projJson = await projRes.json();

        if (invJson.success && Array.isArray(invJson.items)) {
            materialsData = invJson.items;
        } else {
            materialsData = [];
        }

        if (projJson.success && Array.isArray(projJson.projects)) {
            projectsData = projJson.projects;
        } else {
            projectsData = [];
        }

        populateSelects();
        renderList();
        await loadRecentTransactions();
    } catch (e) {
        console.error('抓取資料失敗:', e);
        showToast("資料拉取失敗，請檢查網路連線");
        document.getElementById('materialList').innerHTML = `<div style="text-align:center; padding: 40px; color:var(--red); font-weight:bold;">連線到伺服器失敗，請重新整理</div>`;
    }
}


const RECENT_TYPE_INFO = {
    PURCHASE_IN: { label:'採購入庫', icon:'➕', cls:'purchase' },
    WAREHOUSE_ADJUSTMENT: { label:'盤點修正', icon:'🔄', cls:'adjust' },
    PROJECT_TRANSFER_OUT: { label:'領至案場', icon:'🚚', cls:'transfer' },
    PROJECT_RETURN: { label:'案場退回', icon:'↩️', cls:'return' },
    INITIAL_COUNT: { label:'期初盤點', icon:'📋', cls:'adjust' }
};
function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}
function formatRecentTime(value) {
    if (!value) return '';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return escapeHtml(value);
    return new Intl.DateTimeFormat('zh-TW', { timeZone:'Asia/Taipei', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false }).format(date);
}
function renderRecentTransactions(items) {
    const body = document.getElementById('recentBody');
    const summary = document.getElementById('recentSummary');
    if (!Array.isArray(items) || items.length === 0) {
        summary.textContent = '尚無倉庫異動';
        body.innerHTML = '<div class="recent-state">完成第一次庫存異動後，紀錄會顯示在這裡。</div>';
        return;
    }
    const first = items[0];
    const firstInfo = RECENT_TYPE_INFO[first.transactionType] || { label:first.transactionType || '庫存異動', icon:'📦', cls:'adjust' };
    summary.textContent = `${firstInfo.label}・${first.materialName}・${Number(first.quantityChange) > 0 ? '+' : ''}${formatNumber(first.quantityChange)}${first.stockUnit || ''}`;
    body.innerHTML = items.map(item => {
        const info = RECENT_TYPE_INFO[item.transactionType] || { label:item.transactionType || '庫存異動', icon:'📦', cls:'adjust' };
        const change = Number(item.quantityChange || 0);
        const quantityClass = change >= 0 ? 'positive' : 'negative';
        const project = item.projectName ? `${escapeHtml(item.projectName)} · ` : '';
        return `<article class="recent-item ${info.cls}"><div class="recent-accent"></div><div><div class="recent-type">${info.icon} ${escapeHtml(info.label)}</div><div class="recent-material">${escapeHtml(item.materialName)}</div><div class="recent-meta">${formatNumber(item.beforeQuantity)}${escapeHtml(item.stockUnit)} → ${formatNumber(item.afterQuantity)}${escapeHtml(item.stockUnit)}<br>${project}${escapeHtml(item.operatorName || '未填操作人')}</div></div><div><div class="recent-qty ${quantityClass}">${change > 0 ? '+' : ''}${formatNumber(change)}${escapeHtml(item.stockUnit)}</div><div class="recent-time">${formatRecentTime(item.createdAt || item.transactionDate)}</div></div></article>`;
    }).join('');
}
const AUTH_RETRY_KEY = 'warehouseAuthRetryOnce';
function restartLineLogin() {
    if (sessionStorage.getItem(AUTH_RETRY_KEY) === '1') {
        throw new Error('LINE 登入憑證更新失敗，請完全關閉頁面後重新開啟');
    }
    sessionStorage.setItem(AUTH_RETRY_KEY, '1');
    const redirectUri = window.location.href.split('#')[0];
    if (liff.isLoggedIn()) liff.logout();
    liff.login({ redirectUri });
}
function clearAuthRetryFlag() {
    sessionStorage.removeItem(AUTH_RETRY_KEY);
}

async function loadRecentTransactions() {
    try {
        const token = liff.isLoggedIn() ? liff.getIDToken() : null;
        if (!token) {
            restartLineLogin();
            return;
        }

        const response = await fetch(`${API_BASE_URL}/api/warehouse/recent-transactions?limit=5`, {
            headers: { Authorization: `Bearer ${token}` }
        });

        const responseText = await response.text();
        let result = null;
        try {
            result = responseText ? JSON.parse(responseText) : {};
        } catch (parseError) {
            throw new Error(`API 回傳格式錯誤（HTTP ${response.status}）`);
        }

        if (response.status === 401) {
            restartLineLogin();
            return;
        }
        if (!response.ok || !result.success) {
            const apiMessage = result.error || result.message || '伺服器回應錯誤';
            throw new Error(`${apiMessage}（HTTP ${response.status}）`);
        }

        clearAuthRetryFlag();
        renderRecentTransactions(result.items);
    } catch (error) {
        const message = String(error?.message || '未知錯誤');
        console.error('最近異動載入失敗:', error);
        document.getElementById('recentSummary').textContent = `載入失敗：${message}`;
        document.getElementById('recentBody').innerHTML = `
            <div class="recent-state">
                ⚠️ 最近異動載入失敗<br>
                <strong style="display:block; margin-top:6px; color:var(--red); overflow-wrap:anywhere;">${escapeHtml(message)}</strong>
                <span style="display:block; margin-top:6px;">庫存操作不受影響。</span>
                <button type="button" class="chip" onclick="loadRecentTransactions()" style="margin-top:8px">重新載入</button>
            </div>`;
    }
}
function toggleRecent() {
    const body = document.getElementById('recentBody');
    const button = document.getElementById('recentButton');
    const toggle = document.getElementById('recentToggle');
    const opening = body.classList.contains('hidden');
    body.classList.toggle('hidden', !opening);
    button.setAttribute('aria-expanded', String(opening));
    toggle.textContent = opening ? '收合' : '展開最近5筆';
}

function populateSelects() {
    const mSel = document.getElementById('sheetMaterial');
    mSel.innerHTML = materialsData.map(m => {
        const stock = Number(m.stockQuantity || 0);
        return `<option value="${m.materialId}">${m.materialName} (庫存:${stock}${m.stockUnit})</option>`;
    }).join('');
    
    const pSel = document.getElementById('sheetProject');
    pSel.innerHTML = projectsData.map(p => {
        return `<option value="${p.projectId}">${p.projectName}</option>`;
    }).join('');
}

function formatNumber(value) {
    return new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 4 }).format(Number(value || 0));
}
function renderList() {
    const searchStr = document.getElementById('searchInput').value.toLowerCase();
    const managed = materialsData.filter(m => m.inventoryManaged !== false);
    const sumTotal = managed.length;
    const sumLow = managed.filter(m => m.minimumStockEnabled === true && m.stockStatus === 'LOW_STOCK').length;
    const sumEmpty = managed.filter(m => m.stockStatus === 'OUT_OF_STOCK').length;
    const html = managed.filter(m => {
        if (searchStr && !String(m.materialName || '').toLowerCase().includes(searchStr) && !String(m.materialCode || '').toLowerCase().includes(searchStr)) return false;
        if (currentFilter === 'empty' && m.stockStatus !== 'OUT_OF_STOCK') return false;
        if (currentFilter === 'low' && !(m.minimumStockEnabled === true && m.stockStatus === 'LOW_STOCK')) return false;
        if (currentFilter === 'normal' && m.stockStatus !== 'NORMAL') return false;
        return true;
    }).map(m => {
        const stock = Number(m.stockQuantity || 0);
        const baseQty = Number.isFinite(Number(m.stockBaseQuantity)) ? Number(m.stockBaseQuantity) : stock * Number(m.packageQuantity || 1);
        let statusCls='normal', statusTxt=m.minimumStockEnabled===true?'庫存正常':'目前庫存', icon='📦', note='';
        if (m.stockStatus === 'OUT_OF_STOCK') { statusCls='empty'; statusTxt='目前缺貨'; icon='⚠️'; }
        else if (m.stockStatus === 'REVIEW_REQUIRED') { statusCls='empty'; statusTxt='帳面異常'; icon='❗'; }
        else if (m.minimumStockEnabled === true && m.stockStatus === 'LOW_STOCK') {
            statusCls='low'; statusTxt='庫存不足'; icon='🪣';
            note=`<div class="minimum-note">最低保有${formatNumber(m.lowStockThreshold)}${m.stockUnit}・尚缺${formatNumber(m.shortageQuantity)}${m.stockUnit}</div>`;
        } else if (m.minimumStockEnabled === true) {
            note=`<div class="minimum-note normal-note">最低保有${formatNumber(m.lowStockThreshold)}${m.stockUnit}・庫存正常</div>`;
        }
        const photo=m.photoUrl||m.imageUrl||m.image||(m.materialCode?m.materialCode+'.jpg':m.materialId+'.jpg');
        const thumb=`<img src="images/${photo}" onerror="this.outerHTML='${icon}'" style="width:100%;height:100%;object-fit:cover;border-radius:13px;">`;
        return `<article class="card" role="button" tabindex="0" aria-label="選擇 ${m.materialName} 並新增庫存異動" onclick="openSheet(null,'${m.materialId}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openSheet(null,'${m.materialId}');}">
          <div class="card-top"><div class="thumb" style="padding:0;background:none;">${thumb}</div><div class="meta"><div class="name">${m.materialName}</div><div class="code">${m.materialCode||'無編號'}</div><span class="status ${statusCls}">${statusTxt}</span>${note}</div><div class="stock"><strong>${formatNumber(stock)}${m.stockUnit}</strong><span>共${formatNumber(baseQty)}${m.baseUnit||m.stockUnit}</span></div></div>
          <div class="card-hint">點擊卡片選擇入庫、盤點、領料或退回 ›</div></article>`;
    }).join('');
    document.getElementById('materialList').innerHTML=html||'<div style="text-align:center;padding:40px;color:#6c757d;">查無符合條件的材料</div>';
    document.getElementById('sumTotal').textContent=sumTotal;
    document.getElementById('sumLow').textContent=sumLow;
    document.getElementById('sumEmpty').textContent=sumEmpty;
}
function setFilter(type) {
    currentFilter = type;
    document.querySelectorAll('.chip').forEach(x => {
        if (x.dataset.filter === type) {
            x.classList.add('active');
        } else {
            x.classList.remove('active');
        }
    });
    renderList();
}

const overlay = document.getElementById('overlay');

function openSheet(type = null, matId = null) {
    currentSubmissionId = createSubmissionId();
    overlay.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    if (matId) document.getElementById('sheetMaterial').value = matId;
    document.getElementById('qty').value = '';
    document.getElementById('sheetRemark').value = '';
    const btn = document.querySelector(`[data-type="${type || 'PURCHASE_IN'}"]`);
    if (btn) chooseType(btn);
    document.getElementById('sheetTitle').textContent = matId ? '選擇異動方式' : '新增庫存異動';
    updatePreview();
}
function closeSheet() {
    overlay.classList.add('hidden');
    document.body.style.overflow = '';
    if (!isSubmitting) currentSubmissionId = '';
}

function chooseType(btn) {
    document.querySelectorAll('.type-btn').forEach(x => x.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.type;
    
    const needsProject = ['PROJECT_TRANSFER_OUT', 'PROJECT_RETURN'].includes(currentType);
    document.getElementById('projectField').hidden = !needsProject;
    document.getElementById('projectImpact').hidden = currentType !== 'PROJECT_TRANSFER_OUT';
    
    const labels = {
        PURCHASE_IN: ['本次入庫數量', '本次入庫'],
        WAREHOUSE_ADJUSTMENT: ['盤點後實際總數量', '盤點差異'],
        PROJECT_TRANSFER_OUT: ['領出數量', '本次領出'],
        PROJECT_RETURN: ['退回數量', '本次退回']
    };
    
    document.getElementById('qtyLabel').textContent = labels[currentType][0];
    document.getElementById('changeLabel').textContent = labels[currentType][1];
    
    updatePreview();
}

function updatePreview() {
    const matId = document.getElementById('sheetMaterial').value;
    const mat = materialsData.find(m => m.materialId === matId);
    if (!mat) return;
    
    const unit = mat.stockUnit;
    const currentStock = Number(mat.stockQuantity || 0);
    const q = Number(document.getElementById('qty').value || 0);
    
    let after = currentStock;
    let sign = '＋';
    let displayQ = q;
    
    if (currentType === 'WAREHOUSE_ADJUSTMENT') {
        after = q;
        const diff = q - currentStock;
        sign = diff >= 0 ? '＋' : '−';
        displayQ = Math.abs(diff);
    } else if (currentType === 'PROJECT_TRANSFER_OUT') {
        after = currentStock - q;
        sign = '−';
    } else {
        after = currentStock + q;
        sign = '＋';
    }

    document.getElementById('prevCurrent').textContent = `${currentStock} ${unit}`;
    document.getElementById('changeValue').textContent = `${sign}${displayQ} ${unit}`;
    
    const afterEl = document.getElementById('afterValue');
    afterEl.textContent = `${after} ${unit}`;
    afterEl.style.color = after < 0 ? 'var(--red)' : '';
    
    if (currentType === 'PROJECT_TRANSFER_OUT') {
        document.getElementById('projImpactValue').textContent = `＋${q} ${unit}`;
    }
}

async function submitTransaction() {
    if (isSubmitting) return;
    const matId = document.getElementById('sheetMaterial').value;
    const qty = Number(document.getElementById('qty').value);
    const operator = document.getElementById('operatorName').value.trim();
    const projectId = document.getElementById('sheetProject').value;
    const transactionDate = document.getElementById('transactionDate').value;
    if (!operator) return alert('請填寫操作人姓名');
    if (!matId) return alert('請選擇材料品項');
    if (!transactionDate) return alert('請選擇異動日期');
    if (!Number.isFinite(qty) || qty < 0) return alert('請輸入有效數量');
    if (qty <= 0 && currentType !== 'WAREHOUSE_ADJUSTMENT') return alert('請輸入大於 0 的有效數量');
    if (['PROJECT_TRANSFER_OUT','PROJECT_RETURN'].includes(currentType) && !projectId) return alert('請選擇案場');

    const mat = materialsData.find(m => m.materialId === matId);
    const currentStock = Number(mat.stockQuantity || 0);
    if (currentType === 'PROJECT_TRANSFER_OUT' && currentStock - qty < 0) {
        return alert(`倉庫庫存不足，目前只有 ${currentStock}${mat.stockUnit}`);
    }

    const names = {PURCHASE_IN:'採購入庫',WAREHOUSE_ADJUSTMENT:'盤點修正',PROJECT_TRANSFER_OUT:'倉庫領至案場',PROJECT_RETURN:'案場退回'};
    let after = currentStock;
    if (currentType === 'WAREHOUSE_ADJUSTMENT') after = qty;
    else if (currentType === 'PROJECT_TRANSFER_OUT') after = currentStock - qty;
    else after = currentStock + qty;

    if (!confirm(`確認執行「${names[currentType]}」？

材料：${mat.materialName}
目前倉庫：${currentStock}${mat.stockUnit}
異動後：${after}${mat.stockUnit}`)) return;

    const btn = document.getElementById('submitBtn');
    isSubmitting = true;
    btn.disabled = true;
    btn.textContent = '⏳ 送出中...';

    let endpoint = '';
    const payload = {submissionId:currentSubmissionId,transactionDate,materialId:matId,operatorName:operator,remarks:document.getElementById('sheetRemark').value};
    if (['PURCHASE_IN','WAREHOUSE_ADJUSTMENT'].includes(currentType)) {
        endpoint = `${API_BASE_URL}/api/warehouse/transactions`;
        payload.transactionType = currentType;
        if (currentType === 'PURCHASE_IN') payload.quantity = qty;
        else payload.actualQuantity = qty;
    } else if (currentType === 'PROJECT_TRANSFER_OUT') {
        endpoint = `${API_BASE_URL}/api/warehouse/project-transfer`;
        payload.projectId = projectId;
        payload.quantity = qty;
    } else {
        endpoint = `${API_BASE_URL}/api/warehouse/project-return`;
        payload.projectId = projectId;
        payload.quantity = qty;
    }

    const token = liff.isLoggedIn() ? liff.getIDToken() : null;
    const headers = {'Content-Type':'application/json'};
    if (token) headers.Authorization = `Bearer ${token}`;

    try {
        const response = await fetch(endpoint,{method:'POST',headers,body:JSON.stringify(payload)});
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.error || '伺服器回應錯誤');
        localStorage.setItem('warehouseOperatorName',operator);
        showToast(result.duplicate ? '此筆異動先前已完成，未重複入帳' : `✅ ${names[currentType]} 完成！`);
        currentSubmissionId = '';
        closeSheet();
        setTimeout(initApp,600);
    } catch (e) {
        alert(`寫入失敗：
${e.message}`);
    } finally {
        isSubmitting = false;
        btn.disabled = false;
        btn.textContent = '確認送出';
    }
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; 
    t.classList.add('show');
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => {
        t.classList.remove('show');
    }, 2600);
}

overlay.addEventListener('click', e => { 
    if (e.target === overlay && !isSubmitting) closeSheet(); 
});

window.addEventListener('load', initApp);
</script>
