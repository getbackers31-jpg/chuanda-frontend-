<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云說工程 - 施工日報與材料進場表</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background:#f4f7f6; padding:15px; color:#333; margin:0; }
    .container { background:white; padding:20px; border-radius:10px; box-shadow:0 4px 8px rgba(0,0,0,.1); max-width:500px; margin:auto; position: relative; }
    h2 { text-align:center; color:#00B900; margin-top:0; font-size:22px; position: relative; }
    .version-tag { font-size: 10px; color: #ccc; position: absolute; right: 0; bottom: 0; font-weight: normal; }
    label { font-weight:bold; display:block; margin-top:15px; margin-bottom:5px; color:#444; }
    select, textarea, input[type="text"], input[type="number"], input[type="date"] { width:100%; padding:10px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box; font-size:16px; background:#fafafa; margin-bottom:5px; }
    .flex-row { display:flex; gap:10px; margin-bottom:5px; }
    .flex-row > * { flex:1; min-width:0; }
    .btn-weather { background:#17a2b8; color:white; border:0; padding:9px; border-radius:5px; cursor:pointer; font-size:14px; width:100%; margin-bottom:10px; }
    .btn-weather:disabled, .btn-add:disabled, .submit-btn:disabled { background:#ccc; cursor:not-allowed; }
    .checkbox-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; background:#f9f9f9; padding:10px; border-radius:5px; border:1px solid #eee; }
    .checkbox-label { display:flex; align-items:center; font-weight:normal; margin:0; font-size:15px; }
    .checkbox-label input { margin-right:8px; transform:scale(1.2); }
    .material-group { background:#f9f9f9; padding:10px; border-radius:5px; border:1px solid #eee; margin-bottom:10px; }
    .material-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }
    .material-title { font-size:14px; font-weight:bold; color:#666; }
    .remove-material-button { color:#d9534f; border:0; background:none; font-weight:bold; cursor:pointer; }
    .btn-add { background:#6c757d; color:white; border:0; padding:9px; border-radius:5px; cursor:pointer; font-size:14px; width:100%; margin-bottom:10px; }
    .submit-btn { width:100%; background:#00B900; color:white; border:0; padding:12px; font-size:18px; border-radius:5px; margin-top:20px; cursor:pointer; font-weight:bold; }
    .section-divider { border-bottom:2px dashed #ddd; margin:20px 0; }
    .hidden { display:none !important; }
    .no-material-option { display:flex; align-items:center; font-weight:bold; color:#d9534f; margin-bottom:15px; background:#fdf5f5; padding:10px; border-radius:5px; border:1px solid #f5c6c6; }
    .no-material-option input { width:auto; margin-right:10px; transform:scale(1.3); }
    .readonly-input { background-color: #e9ecef; color: #495057; cursor: not-allowed; }
    
    /* 防呆視窗專用 CSS */
    .overlay { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 18px; background: rgba(15, 23, 42, .62); backdrop-filter: blur(3px); opacity: 1; visibility: visible; transition: opacity .18s ease, visibility .18s ease; }
    .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .dialog { width: min(100%, 440px); max-height: 92vh; overflow-y: auto; border-radius: 18px; background: #fff; box-shadow: 0 18px 55px rgba(15, 23, 42, .25); transform: translateY(0) scale(1); transition: transform .18s ease; }
    .overlay.hidden .dialog { transform: translateY(10px) scale(.98); }
    .dialog-header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px; border-radius: 18px 18px 0 0; color: #fff; background: linear-gradient(135deg, #f59e0b, #d97706); font-size: 19px; font-weight: 800; }
    .dialog-body { padding: 18px; }
    .warning-copy { margin: 0 0 14px; color: #9a3412; font-weight: 700; line-height: 1.65; }
    .record-card { position: relative; overflow: hidden; margin-bottom: 12px; padding: 13px 14px 13px 16px; border: 1px solid #e5e7eb; border-radius: 12px; line-height: 1.75; }
    .record-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; }
    .record-card.existing { background: #fff1f2; }
    .record-card.existing::before { background: #dc2626; }
    .record-card.current { background: #eff6ff; }
    .record-card.current::before { background: #2563eb; }
    .card-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; font-weight: 800; }
    .source-pill { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,.72); font-size: 12px; font-weight: 700; }
    .modal-row { display: grid; grid-template-columns: 54px 1fr; gap: 8px; font-size: 14px; }
    .modal-row span:first-child { color: #6b7280; }
    .question { margin: 15px 0 13px; padding: 11px; border-radius: 9px; background: #fff7ed; color: #9a3412; font-weight: 800; line-height: 1.55; text-align: center; }
    .actions { display: grid; gap: 10px; }
    .action-btn { width: 100%; padding: 12px 14px; border-radius: 10px; font-size: 16px; font-weight: 800; cursor: pointer; border:none;}
    .back-btn { border: 1px solid #dc2626; color: #dc2626; background: #fff; }
    .confirm-btn { color: #fff; background: #f59e0b; }
    @media (max-width:380px) { .checkbox-grid { grid-template-columns:1fr; } .flex-row { flex-direction:column; gap:4px; } }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="formTitle">👷 施工日報表 <span class="version-tag">v6.0</span></h2>

    <div style="display:flex; gap:10px; margin-bottom:15px;">
        <button type="button" id="btnDailyMode" class="btn btn-primary" style="flex:1; padding:10px; border:none; border-radius:5px; background:#00B900; color:white; font-weight:bold; cursor:pointer;" onclick="switchMode('daily_report')">📝 填寫施工日報</button>
        <button type="button" id="btnIssueMode" class="btn btn-outline-secondary" style="flex:1; padding:10px; border:1px solid #ccc; border-radius:5px; background:#e9ecef; color:#333; font-weight:bold; cursor:pointer;" onclick="switchMode('material_issue')">🚚 供應商直送案場</button>
    </div>

    <form id="dailyReportForm">
      <input type="hidden" id="formType" value="daily_report">

      <div id="issueExtraSection" class="hidden" style="background:#f8f9fa; padding:12px; border-radius:5px; border-left:4px solid #28a745; margin-bottom:15px;">
        <div style="background-color: #fff3cd; border-left: 5px solid #ffc107; padding: 12px 16px; border-radius: 6px; font-size: 0.9rem; color: #856404; margin-bottom: 16px; line-height: 1.5;">
            <strong>⚠️️ 供應商直接送到工地，才使用此功能。</strong><br><br>
            如果材料是從公司大倉庫領出帶過去的，請一律使用庫存系統的「領至案場」，請勿在此重複登記，以免庫存錯亂。
        </div>

        <label for="issueType" style="margin-top:0;">🚚 進場類型 <span style="color:red">*</span></label>
        <select id="issueType" onchange="updateAllBalances(); saveDraft()" style="margin-bottom:10px;">
          <option value="" selected disabled>請選擇進場類型</option>
          <option value="OPENING">🏢 開工首批進場</option>
          <option value="ADDITIONAL">🚚 後續追加進場</option>
        </select>

        <label for="reportDate" style="margin-top:0;">📅 實際進場日期 (可往回補登) <span style="color:red">*</span></label>
        <input type="date" id="reportDate" onchange="saveDraft()">
      </div>
      
      <label for="reporterName">👤 填表人姓名</label>
      <input type="text" id="reporterName" placeholder="請輸入您的姓名 (系統將自動記憶)" oninput="saveDraft()" autocomplete="name" required>

      <div id="lockedProjectSection" class="hidden">
        <label for="lockedProjectName">📍 案場名稱</label>
        <input type="text" id="lockedProjectName" class="readonly-input" readonly disabled>
      </div>

      <div id="compatibleProjectSection">
        <label for="projectName">📍 案場名稱</label>
        <select id="projectName" onchange="handleProjectChange()" required disabled>
          <option value="" disabled selected>正在載入案場清單...</option>
        </select>
      </div>
      <input type="hidden" id="projectId" value="">

      <div class="daily-only">
        <label class="no-material-option" style="margin-top:15px; background:#fff3f3; border-color:#ffcccc; color:#cc0000;">
          <input type="checkbox" id="noWorkToday" onchange="handleNoWorkChange(); saveDraft()">今日無出工 (停工/休息)
        </label>
      </div>

      <div id="noWorkReasonSection" class="hidden">
        <select id="noWorkReason" onchange="saveDraft()" style="border-color:#ffcccc; background:#fffcfc;">
          <option value="" disabled selected>請選擇無出工原因</option>
          <option value="天候因素 (下雨/颱風等)">天候因素 (下雨/颱風等)</option>
          <option value="例假日休息">例假日休息</option>
          <option value="現場無施工安排">現場無施工安排</option>
          <option value="停工/待料">停工/待料</option>
          <option value="其他">其他 (請於最下方備註說明)</option>
        </select>
        <div class="section-divider"></div>
      </div>

      <div id="contractorSection" class="daily-only">
        <label>🤝 施工廠商與人數</label>
        <div id="contractorsContainer"></div>
        <button type="button" class="btn-add" onclick="addContractorRow()" style="background:#5bc0de;">➕ 新增一組廠商</button>
        <div class="section-divider"></div>
      </div>

      <div class="daily-only">
        <label>🌤️ 氣象資訊</label>
        <button type="button" class="btn-weather" onclick="getWeather()">一鍵獲取當地天氣</button>
        <div class="flex-row">
          <input type="number" id="temp" placeholder="溫度(度)" step="0.1" oninput="saveDraft()">
          <input type="number" id="humidity" placeholder="濕度(%)" min="0" max="100" step="1" oninput="saveDraft()">
          <input type="number" id="wind" placeholder="風速(m/s)" min="0" step="0.1" oninput="saveDraft()">
        </div>
        <div class="section-divider"></div>
      </div>

      <div id="workAndMaterialSection" class="daily-only">
        <label>🛠️ 今日作業</label>
        <div class="checkbox-grid" id="workItemsGrid"></div>
        <input type="text" id="customWorkItem" class="hidden" placeholder="請具體說明其他施作項目內容..." maxlength="100" oninput="saveDraft()" style="margin-top:10px">
        <textarea id="workNotes" rows="2" placeholder="作業補充（選填）" oninput="saveDraft()" style="margin-top:10px"></textarea>
        <div class="section-divider"></div>
      </div>

      <div id="materialSectionContainer">
        <label id="materialLabel">📦 今日用料</label>
        <div id="noMaterialWrapper" class="daily-only">
          <label class="no-material-option">
            <input type="checkbox" id="noMaterial" onchange="handleNoMaterialChange(); saveDraft()">今日無用料
          </label>
        </div>
        <div id="materialsContainer"></div>
        <button type="button" id="addMaterialButton" class="btn-add" onclick="addMaterialRow()">新增一項用料</button>
        <div class="section-divider"></div>
      </div>

      <label for="remarks">📝 備註（選填）</label>
      <textarea id="remarks" rows="2" placeholder="天候影響、材料短缺、人員異動等狀況" maxlength="500" oninput="saveDraft()"></textarea>

      <button type="button" id="submitButton" class="submit-btn" onclick="submitForm()">確認送出施工日報</button>
    </form>
  </div>

  <!-- 💡 409 防呆警告視窗 -->
  <div id="duplicateIssueOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="warningTitle">
    <div class="dialog">
      <div class="dialog-header" id="warningTitle"><span aria-hidden="true">⚠️</span>發現疑似重複進場</div>
      <div class="dialog-body">
        <p class="warning-copy">今天已有相同材料從公司倉庫領入此案場。請比較以下兩筆資料，確認本次是否確實為另一批供應商直送材料。</p>
        <section class="record-card existing">
          <div class="card-heading"><span>已存在的進場紀錄</span><span class="source-pill">📦 公司倉庫</span></div>
          <div class="modal-row"><span>材料</span><strong id="existingMaterialName"></strong></div>
          <div class="modal-row"><span>數量</span><strong id="existingQuantity"></strong></div>
          <div class="modal-row"><span>日期</span><strong id="existingDate"></strong></div>
        </section>
        <section class="record-card current">
          <div class="card-heading"><span>目前準備登記</span><span class="source-pill">🚚 供應商直送</span></div>
          <div class="modal-row"><span>材料</span><strong id="currentMaterialName"></strong></div>
          <div class="modal-row"><span>數量</span><strong id="currentQuantity"></strong></div>
          <div class="modal-row"><span>日期</span><strong id="currentDate"></strong></div>
          <div class="modal-row"><span>影響</span><strong>只增加案場領入，不扣倉庫</strong></div>
        </section>
        <div class="question">請確認這是否為另一批材料。</div>
        <div class="actions">
          <button type="button" class="action-btn back-btn" onclick="closeDuplicateWarning()">返回檢查 (取消送出)</button>
          <button type="button" class="action-btn confirm-btn" onclick="confirmDirectIssue()">確定為另一批，仍要登記</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const LIFF_ID = '2011289657-vQgMb0eI'; 
    const API_BASE_URL = 'https://gong-cheng-linechuan-jie.onrender.com';
    const API_URL = `${API_BASE_URL}/api/submit-report`;
    const PROJECTS_API_URL = `${API_BASE_URL}/api/projects`;
    const MATERIALS_API_URL = `${API_BASE_URL}/api/materials`;
    const MATERIAL_BALANCES_API_URL = `${API_BASE_URL}/api/projects`;
    
    const MAX_MATERIAL_ROWS = 10;
    const MAX_CONTRACTOR_ROWS = 10;
    const CONTRACTORS_KEY = 'savedContractors';

    const workItemsList = ['材料進場', '現場放樣', '鷹架搭設', '鷹架拆除', '水刀除鏽', '手動工具除鏽', '底漆施工', '中塗漆施工', '面漆施工', '底漆修補', '中塗漆修補', '面漆修補', '底漆膜厚檢測', '中塗漆膜厚檢測', '面漆膜厚檢測', '缺失改善', '現場清潔', '等待驗收', '完成驗收', '其他'];
    let MATERIAL_ITEMS_MAP = new Map(); 
    let MATERIAL_OPTIONS = []; 
    let projectMaterialBalances = {}; 
    let isSubmitting = false;
    let isRestoringDraft = false;
    let projectMode = 'LOADING';
    let currentSubmissionId = '';
    let pendingDirectPayload = null; // 存放 409 攔截時的資料

    function getTaiwanDateString() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }

    function switchMode(mode) {
        document.getElementById('formType').value = mode;
        const btnDaily = document.getElementById('btnDailyMode'), btnIssue = document.getElementById('btnIssueMode');
        const dailyOnlyElements = document.querySelectorAll('.daily-only'), issueExtraSection = document.getElementById('issueExtraSection');
        const formTitle = document.getElementById('formTitle'), submitButton = document.getElementById('submitButton'), materialLabel = document.getElementById('materialLabel');

        if (mode === 'daily_report') {
            btnDaily.style.background = '#00B900'; btnDaily.style.color = 'white'; btnDaily.style.border = 'none';
            btnIssue.style.background = '#e9ecef'; btnIssue.style.color = '#333'; btnIssue.style.border = '1px solid #ccc';
            formTitle.innerHTML = '👷 施工日報表 <span class="version-tag">v6.0</span>';
            submitButton.textContent = '確認送出施工日報'; submitButton.style.background = '#00B900';
            materialLabel.textContent = '📦 今日用料';
            issueExtraSection.classList.add('hidden'); dailyOnlyElements.forEach(el => el.classList.remove('hidden'));
        } else {
            btnDaily.style.background = '#e9ecef'; btnDaily.style.color = '#333'; btnDaily.style.border = '1px solid #ccc';
            btnIssue.style.background = '#28a745'; btnIssue.style.color = 'white'; btnIssue.style.border = 'none';
            formTitle.innerHTML = '🚚 供應商直送登記表 <span class="version-tag">v6.0</span>';
            submitButton.textContent = '確認登記供應商直送'; submitButton.style.background = '#28a745';
            materialLabel.textContent = '📦 進場材料清單';
            issueExtraSection.classList.remove('hidden'); dailyOnlyElements.forEach(el => el.classList.add('hidden'));
        }
        updateAllBalances(); saveDraft();
    }

    function updateAllBalances() { document.querySelectorAll('#materialsContainer .material-group').forEach(group => { updateBalanceDisplay(group); }); }
    function ensureSubmissionId() { if (!currentSubmissionId) currentSubmissionId = window.crypto && typeof window.crypto.randomUUID === 'function' ? window.crypto.randomUUID() : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2); return currentSubmissionId; }
    function getSelectedProjectName() { if (projectMode === 'LOCKED') return document.getElementById('lockedProjectName').value.trim(); const select = document.getElementById('projectName'); return select.options[select.selectedIndex]?.text.trim() || ''; }
    function getDraftKey() { const projectId = document.getElementById('projectId').value.trim(); return projectId ? `dailyReportDraft:${projectId}` : 'dailyReportDraft'; }
    function getProjectIdFromUrl() { const params = new URLSearchParams(window.location.search); let pid = params.get('projectId'); if (!pid && params.has('liff.state')) { const stateParams = new URLSearchParams('?' + params.get('liff.state')); pid = stateParams.get('projectId'); } return String(pid || '').trim(); }

    async function fetchMaterials(projectId = '') { try { const url = projectId ? `${MATERIALS_API_URL}?projectId=${projectId}` : MATERIALS_API_URL; const res = await fetch(url); const data = await res.json(); if (data.success && data.materials) { MATERIAL_OPTIONS = data.materials; MATERIAL_ITEMS_MAP.clear(); MATERIAL_OPTIONS.forEach(m => { if (m.materialId) MATERIAL_ITEMS_MAP.set(m.materialId, m); }); } } catch (err) {} }
    async function fetchMaterialBalances(projectId) { try { const res = await fetch(`${MATERIAL_BALANCES_API_URL}/${encodeURIComponent(projectId)}/material-balances`); const data = await res.json(); if (data.success && data.balances) { projectMaterialBalances = {}; data.balances.forEach(b => projectMaterialBalances[b.materialId] = b); } } catch (err) {} }

    window.addEventListener('load', async () => {
      initializeStaticForm();
      const dateInput = document.getElementById('reportDate'); if (dateInput) { dateInput.value = getTaiwanDateString(); dateInput.max = getTaiwanDateString(); }
      const savedReporterName = localStorage.getItem('savedReporterName'); if (savedReporterName) document.getElementById('reporterName').value = savedReporterName;
      try { await liff.init({ liffId: LIFF_ID }); const profile = await liff.getProfile(); const nameInput = document.getElementById('reporterName'); if (profile && !nameInput.value.trim()) { nameInput.value = profile.displayName; localStorage.setItem('savedReporterName', profile.displayName); } } catch (error) {}
      const projectIdFromUrl = getProjectIdFromUrl();
      try { if (projectIdFromUrl) { await loadLockedProject(projectIdFromUrl); await fetchMaterials(projectIdFromUrl); await fetchMaterialBalances(projectIdFromUrl); } else { await loadProjects(); await fetchMaterials(''); } loadDraft(); } catch (error) { projectMode = 'ERROR'; document.getElementById('submitButton').disabled = true; alert('案場載入失敗'); }
    });

    async function loadLockedProject(projectId) { const res = await fetch(`${PROJECTS_API_URL}/${encodeURIComponent(projectId)}`); const result = await res.json(); if (!res.ok || !result.success) throw new Error(); document.getElementById('projectId').value = result.project.projectId; document.getElementById('lockedProjectName').value = result.project.projectName; document.getElementById('compatibleProjectSection').classList.add('hidden'); document.getElementById('lockedProjectSection').classList.remove('hidden'); projectMode = 'LOCKED'; }
    async function loadProjects() { const res = await fetch(PROJECTS_API_URL); const result = await res.json(); if (!res.ok || !result.success) throw new Error(); const select = document.getElementById('projectName'); select.innerHTML = ''; select.add(new Option('請選擇正式案場', '', true, true)); result.projects.forEach(p => select.add(new Option(p.projectName, p.projectId))); select.options[0].disabled = true; select.disabled = false; projectMode = 'COMPATIBLE'; }
    async function handleProjectChange() { const select = document.getElementById('projectName'), projectId = select.value; if (!projectId) return; document.getElementById('projectId').value = projectId; await fetchMaterials(projectId); await fetchMaterialBalances(projectId); document.getElementById('materialsContainer').innerHTML = ''; if (!document.getElementById('noMaterial').checked) addMaterialRow(); saveDraft(); }

    function getSavedContractorsList() { let saved = localStorage.getItem(CONTRACTORS_KEY); if (!saved) { const def = ['容煜', '詮達']; localStorage.setItem(CONTRACTORS_KEY, JSON.stringify(def)); return def; } try { return JSON.parse(saved); } catch { return []; } }
    function initializeStaticForm() { const grid = document.getElementById('workItemsGrid'); workItemsList.forEach(item => { const lbl = document.createElement('label'); lbl.className = 'checkbox-label'; const cb = document.createElement('input'); cb.type = 'checkbox'; cb.name = 'workItem'; cb.value = item; cb.onchange = handleWorkItemChange; lbl.append(cb, document.createTextNode(` ${item}`)); grid.appendChild(lbl); }); }
    function handleWorkItemChange() { if (isRestoringDraft) return; const hasOther = [...document.querySelectorAll('input[name="workItem"]:checked')].some(cb => cb.value === '其他'); const input = document.getElementById('customWorkItem'); input.classList.toggle('hidden', !hasOther); if (!hasOther) input.value = ''; saveDraft(); }
    function handleNoWorkChange() { const isNoWork = document.getElementById('noWorkToday').checked; document.getElementById('noWorkReasonSection').classList.toggle('hidden', !isNoWork); document.getElementById('contractorSection').classList.toggle('hidden', isNoWork); }
    function handleNoMaterialChange() { const noMat = document.getElementById('noMaterial').checked; document.getElementById('materialsContainer').style.display = noMat ? 'none' : 'block'; document.getElementById('addMaterialButton').style.display = noMat ? 'none' : 'block'; if (!noMat && document.getElementById('materialsContainer').children.length === 0) addMaterialRow(); }

    function addContractorRow(name='', customName='', workers='') { const container = document.getElementById('contractorsContainer'); if (container.children.length >= MAX_CONTRACTOR_ROWS) return; const div = document.createElement('div'); div.className = 'contractor-group material-group'; div.innerHTML = `<div class="material-header"><div class="material-title"></div><button type="button" class="remove-material-button" onclick="this.closest('.contractor-group').remove(); refreshContractorTitles(); saveDraft();">移除</button></div><div class="flex-row"><select class="contractor-name"><option value="" disabled>請選擇廠商</option>${getSavedContractorsList().map(c=>`<option value="${c}">${c}</option>`).join('')}<option value="其他">其他 (自行輸入)</option></select><input type="number" class="contractor-workers" placeholder="人數" min="1" step="1"></div><input type="text" class="custom-contractor-name hidden" placeholder="請輸入新廠商名稱">`; const nSel = div.querySelector('.contractor-name'), cInp = div.querySelector('.custom-contractor-name'), wInp = div.querySelector('.contractor-workers'); nSel.onchange = () => { const isCustom = nSel.value === '其他'; cInp.classList.toggle('hidden', !isCustom); if(isCustom) cInp.focus(); else cInp.value=''; saveDraft(); }; cInp.oninput = saveDraft; wInp.oninput = saveDraft; const isCust = name === '其他' || (name && !getSavedContractorsList().includes(name)); nSel.value = isCust ? '其他' : name; if(isCust){ cInp.value = name==='其他'?customName:name; cInp.classList.remove('hidden'); } if(workers) wInp.value = workers; container.appendChild(div); refreshContractorTitles(); if(!isRestoringDraft) saveDraft(); }
    function refreshContractorTitles() { document.querySelectorAll('.contractor-group').forEach((g, i) => g.querySelector('.material-title').textContent = `施工廠商 ${i + 1}`); }

    function addMaterialRow(materialId='', qty='') { const container = document.getElementById('materialsContainer'); if (container.children.length >= MAX_MATERIAL_ROWS) return; const div = document.createElement('div'); div.className = 'material-group'; div.innerHTML = `<div class="material-header"><div class="material-title"></div><button type="button" class="remove-material-button" onclick="this.closest('.material-group').remove(); refreshMaterialTitles(); saveDraft();">移除</button></div><div class="flex-row"><select class="mat-name"><option value="" disabled>請選擇標準材料...</option>${MATERIAL_OPTIONS.map(m=>`<option value="${m.materialId}">${m.materialName}</option>`).join('')}</select><div class="flex-row" style="flex:0.6"><input type="number" class="mat-qty" placeholder="數量" step="0.1"><div class="mat-unit-display" style="padding:10px;background:#e9ecef;border:1px solid #ccc;border-radius:5px;color:#555;text-align:center;min-width:50px">單位</div></div></div><div class="material-balance-info hidden" style="font-size:13px;color:#555;background:#eef5ee;padding:8px;border-left:3px solid #00B900;margin-top:5px;border-radius:4px;"></div>`; const mSel = div.querySelector('.mat-name'), qInp = div.querySelector('.mat-qty'), uDisp = div.querySelector('.mat-unit-display'); mSel.onchange = () => { if(mSel.value && MATERIAL_ITEMS_MAP.has(mSel.value)) uDisp.textContent = MATERIAL_ITEMS_MAP.get(mSel.value).stockUnit; updateBalanceDisplay(div); saveDraft(); }; qInp.oninput = () => { updateBalanceDisplay(div); saveDraft(); }; if(materialId && MATERIAL_ITEMS_MAP.has(materialId)){ mSel.value = materialId; uDisp.textContent = MATERIAL_ITEMS_MAP.get(materialId).stockUnit; } if(qty) qInp.value = qty; container.appendChild(div); refreshMaterialTitles(); if(!isRestoringDraft) saveDraft(); }
    function refreshMaterialTitles() { document.querySelectorAll('.material-group').forEach((g, i) => g.querySelector('.material-title').textContent = `品項 ${i + 1}`); document.getElementById('addMaterialButton').disabled = document.querySelectorAll('.material-group').length >= MAX_MATERIAL_ROWS; }
    function updateBalanceDisplay(groupDiv) { const select = groupDiv.querySelector('.mat-name'), qtyInput = groupDiv.querySelector('.mat-qty'), infoDiv = groupDiv.querySelector('.material-balance-info'); const materialId = select.value; if (!materialId || !projectMaterialBalances[materialId]) { infoDiv.classList.add('hidden'); return; } const bData = projectMaterialBalances[materialId], iQty = Number(qtyInput.value) || 0, itm = MATERIAL_ITEMS_MAP.get(materialId), pkgQty = itm && itm.packageQuantity ? Number(itm.packageQuantity) : 1, bUnit = itm ? (itm.baseUnit || itm.stockUnit) : '', curUse = iQty * pkgQty, curRem = bData.remainingBaseQuantity, expRem = curRem - curUse, formType = document.getElementById('formType').value; infoDiv.classList.remove('hidden'); if (formType === 'material_issue') { const lbl = document.getElementById('issueType').value === 'OPENING' ? '本次開工首批進場' : '本次追加進場'; infoDiv.style.borderLeftColor = '#00B900'; infoDiv.style.backgroundColor = '#eef5ee'; infoDiv.innerHTML = `<strong>目前案場剩餘：</strong> ${curRem} ${bUnit}<br><span style="color: #00B900;"><strong>${lbl}：</strong> +${curUse} ${bUnit}</span><br><strong>登記後預計剩餘：</strong> ${curRem + curUse} ${bUnit}`; } else { if (expRem < 0 && iQty > 0) { infoDiv.style.borderLeftColor = '#dc3545'; infoDiv.style.backgroundColor = '#fff3f3'; infoDiv.innerHTML = `<strong>目前案場剩餘：</strong> ${curRem} ${bUnit}<br><strong>本次預計耗用：</strong> -${curUse} ${bUnit}<br><strong>送出後預計剩餘：</strong> <span style="color:#dc3545;font-weight:bold;">${expRem} ${bUnit}</span>`; } else { infoDiv.style.borderLeftColor = '#00B900'; infoDiv.style.backgroundColor = '#eef5ee'; infoDiv.innerHTML = `<strong>目前理論剩餘：</strong> ${curRem} ${bUnit}<br><span style="color:#007bff;"><strong>送出後預計剩餘：</strong> ${expRem} ${bUnit}</span>`; } } }

    async function getWeather() { if (!navigator.geolocation) return; navigator.geolocation.getCurrentPosition(async pos => { try { const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&wind_speed_unit=ms&timezone=Asia%2FTaipei`); const data = await res.json(); document.getElementById('temp').value = Number(data.current.temperature_2m).toFixed(1); document.getElementById('humidity').value = Math.round(data.current.relative_humidity_2m); document.getElementById('wind').value = Number(data.current.wind_speed_10m).toFixed(1); saveDraft(); } catch(e){} }, ()=>{}, {timeout:10000}); }
    
    function saveDraft() {
      if (isRestoringDraft || (projectMode !== 'LOCKED' && projectMode !== 'COMPATIBLE')) return;
      const rName = document.getElementById('reporterName').value.trim(); if(rName) localStorage.setItem('savedReporterName', rName);
      const draft = { formType: document.getElementById('formType').value, issueType: document.getElementById('issueType').value, submissionId: ensureSubmissionId(), projectId: document.getElementById('projectId').value.trim(), reportDate: document.getElementById('reportDate').value, isNoWork: document.getElementById('noWorkToday').checked, noWorkReason: document.getElementById('noWorkReason').value, contractorsList: [...document.querySelectorAll('.contractor-group')].map(g=>({name:g.querySelector('.contractor-name').value, customName:g.querySelector('.custom-contractor-name').value, workers:g.querySelector('.contractor-workers').value})), workItems: [...document.querySelectorAll('input[name="workItem"]:checked')].map(c=>c.value), customWorkItem: document.getElementById('customWorkItem').value, workNotes: document.getElementById('workNotes').value, noMaterial: document.getElementById('noMaterial').checked, materialsList: [...document.querySelectorAll('.material-group')].map(g=>({materialId:g.querySelector('.mat-name').value, qty:g.querySelector('.mat-qty').value})), remarks: document.getElementById('remarks').value, temp: document.getElementById('temp').value, humidity: document.getElementById('humidity').value, wind: document.getElementById('wind').value };
      localStorage.setItem(getDraftKey(), JSON.stringify(draft));
    }
    
    function loadDraft() { isRestoringDraft = true; try { const saved = localStorage.getItem(getDraftKey()); if (!saved) { currentSubmissionId = ensureSubmissionId(); addContractorRow(); addMaterialRow(); return; } const draft = JSON.parse(saved); if (draft.formType) switchMode(draft.formType); if (draft.issueType) document.getElementById('issueType').value = draft.issueType; if (draft.reportDate) document.getElementById('reportDate').value = draft.reportDate; currentSubmissionId = String(draft.submissionId || ensureSubmissionId()); if (draft.isNoWork) { document.getElementById('noWorkToday').checked = true; document.getElementById('noWorkReason').value = draft.noWorkReason || ''; handleNoWorkChange(); } ['temp','humidity','wind','workNotes','remarks'].forEach(id => { document.getElementById(id).value = draft[id] || ''; }); document.getElementById('contractorsContainer').innerHTML=''; if(draft.contractorsList?.length>0) draft.contractorsList.forEach(c=>addContractorRow(c.name, c.customName, c.workers)); else addContractorRow(); if(draft.workItems) { document.querySelectorAll('input[name="workItem"]').forEach(cb => cb.checked = draft.workItems.includes(cb.value)); const hasO = draft.workItems.includes('其他'); document.getElementById('customWorkItem').classList.toggle('hidden', !hasO); document.getElementById('customWorkItem').value = hasO ? (draft.customWorkItem||'') : ''; } const noMat = draft.noMaterial === true; document.getElementById('noMaterial').checked = noMat; if(noMat) handleNoMaterialChange(); else { document.getElementById('materialsContainer').style.display='block'; document.getElementById('materialsContainer').innerHTML=''; if(draft.materialsList?.length>0) draft.materialsList.forEach(m=>addMaterialRow(m.materialId, m.qty)); else addMaterialRow(); } } catch(e){ localStorage.removeItem(getDraftKey()); document.getElementById('contractorsContainer').innerHTML=''; addContractorRow(); addMaterialRow(); } finally { isRestoringDraft = false; } }

    function buildMaterialItems() { const formType = document.getElementById('formType').value, isNoW = formType==='daily_report' && document.getElementById('noWorkToday').checked, isNoM = formType==='daily_report' && document.getElementById('noMaterial').checked; if(isNoW || isNoM) return []; return [...document.querySelectorAll('.material-group')].map(g => { const sId = g.querySelector('.mat-name').value; if(!sId || !MATERIAL_ITEMS_MAP.has(sId)) return null; const itm = MATERIAL_ITEMS_MAP.get(sId), qty = Number(g.querySelector('.mat-qty').value)||0; return { materialId: itm.materialId, materialName: itm.materialName, quantity: qty, stockUnit: itm.stockUnit, baseQuantity: qty * (itm.packageQuantity||1), baseUnit: itm.baseUnit||itm.stockUnit }; }).filter(i => i && i.quantity > 0); }
    function validateForm() { if(!document.getElementById('reporterName').value.trim()) return alert('請填寫姓名'), false; if(!getSelectedProjectName()) return alert('請選擇案場'), false; const formType = document.getElementById('formType').value; if (formType === 'material_issue') { if(!document.getElementById('issueType').value || !document.getElementById('reportDate').value) return alert('進場類型/日期未填'), false; const grps = document.querySelectorAll('.material-group'); let count=0; for(let g of grps){ if(!g.querySelector('.mat-name').value || !Number(g.querySelector('.mat-qty').value)) continue; count++; } if(count===0) return alert('至少填寫一筆材料'), false; } return true; }

    async function submitForm() {
      if (isSubmitting || !validateForm()) return;
      const btn = document.getElementById('submitButton'), formType = document.getElementById('formType').value;
      isSubmitting = true; btn.disabled = true; btn.textContent = '⏳ 正在送出...';

      let payload = { formType, projectId: document.getElementById('projectId').value.trim(), projectName: getSelectedProjectName(), submissionId: ensureSubmissionId(), reporterName: document.getElementById('reporterName').value.trim(), remarks: document.getElementById('remarks').value.trim()||'無' };
      if (formType === 'material_issue') { payload.issueType = document.getElementById('issueType').value; payload.date = document.getElementById('reportDate').value; payload.materialItems = buildMaterialItems(); payload.forceDirectIssue = false; } 
      else { if(document.getElementById('noWorkToday').checked){ payload.isNoWork=true; payload.noWorkReason=document.getElementById('noWorkReason').value; payload.contractorItems=[]; payload.workItems=[]; payload.materialItems=[]; } else { payload.isNoWork=false; payload.contractorItems = [...document.querySelectorAll('.contractor-group')].map(g=>({contractorName:g.querySelector('.contractor-name').value==='其他'?g.querySelector('.custom-contractor-name').value:g.querySelector('.contractor-name').value, workerCount:Number(g.querySelector('.contractor-workers').value)})).filter(i=>i.contractorName&&i.workerCount); payload.workItems=[...document.querySelectorAll('input[name="workItem"]:checked')].map(c=>c.value); payload.customWorkItem=document.getElementById('customWorkItem').value; payload.workNotes=document.getElementById('workNotes').value; payload.materialItems=buildMaterialItems(); } }
      
      await performFetch(payload);
    }

    async function performFetch(payload) {
        const btn = document.getElementById('submitButton'), formType = document.getElementById('formType').value;
        try {
            const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const result = await res.json();
            
            // 💡 攔截 409 防呆邏輯 (觸發設計好的 Modal)
            if (res.status === 409 && result.requiresConfirmation) {
                const match = result.matches[0];
                const curMat = payload.materialItems[0];
                document.getElementById('existingMaterialName').textContent = match.materialName;
                document.getElementById('existingQuantity').textContent = `${match.quantity} ${match.stockUnit}`;
                document.getElementById('existingDate').textContent = payload.date;
                document.getElementById('currentMaterialName').textContent = curMat.materialName;
                document.getElementById('currentQuantity').textContent = `${curMat.quantity} ${curMat.stockUnit}`;
                document.getElementById('currentDate').textContent = payload.date;
                
                pendingDirectPayload = payload;
                document.getElementById('duplicateIssueOverlay').classList.remove('hidden');
                document.body.style.overflow = 'hidden';
                isSubmitting = false; btn.disabled = false; btn.textContent = '確認登記供應商直送';
                return;
            }

            if (!res.ok || !result.success) throw new Error(result.error || '寫入失敗');
            
            localStorage.setItem('savedReporterName', document.getElementById('reporterName').value.trim());
            localStorage.removeItem(getDraftKey());
            alert('✅ 資料已成功送出');
            if (window.liff && liff.isInClient()) liff.closeWindow(); else window.location.reload();
        } catch (e) { alert('⚠️ 送出失敗：' + e.message); isSubmitting = false; btn.disabled = false; btn.textContent = formType === 'material_issue' ? '確認登記供應商直送' : '確認送出施工日報'; }
    }

    // Modal 動作處理
    function closeDuplicateWarning() {
        document.getElementById('duplicateIssueOverlay').classList.add('hidden');
        document.body.style.overflow = '';
    }
    
    async function confirmDirectIssue() {
        closeDuplicateWarning();
        if (pendingDirectPayload) {
            pendingDirectPayload.forceDirectIssue = true;
            const btn = document.getElementById('submitButton');
            isSubmitting = true; btn.disabled = true; btn.textContent = '⏳ 強制寫入中...';
            await performFetch(pendingDirectPayload);
        }
    }
  </script>
</body>
