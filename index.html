<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云說工程 - 施工日報表</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 15px; color: #333; }
        .container { background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h2 { text-align: center; color: #00B900; margin-top: 0; font-size: 22px; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; color: #444; }
        select, textarea, input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; background-color: #fafafa; }
        .flex-row { display: flex; gap: 10px; }
        .flex-row input { width: 33%; }
        button { width: 100%; background-color: #00B900; color: white; border: none; padding: 12px; font-size: 18px; border-radius: 5px; margin-top: 20px; cursor: pointer; font-weight: bold; }
        button:active { background-color: #009900; }
        #loading { display: none; text-align: center; color: #00B900; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>👷‍♂️ 施工日報表</h2>
        <form id="dailyReportForm">
            <!-- 這個是為了給 OneDrive 建資料夾用的 -->
            <label for="projectName">案場位置 (雲端存檔用)：</label>
            <select id="projectName" required>
                <option value="" disabled selected>請選擇目前施工的案場 ▼</option>
                <option value="信義區A案場">信義區 A 案場</option>
                <option value="忠孝東路B案場">忠孝東路 B 案場</option>
                <option value="臨時修繕">臨時修繕</option>
            </select>

            <label>氣象資訊：</label>
            <div class="flex-row">
                <input type="text" id="temp" placeholder="溫度(度)">
                <input type="text" id="humidity" placeholder="濕度(%)">
                <input type="text" id="wind" placeholder="風速(m/s)">
            </div>

            <label for="contractor">施工廠商：</label>
            <select id="contractor" required>
                <option value="" disabled selected>請選擇廠商 ▼</option>
                <option value="容煜">容煜</option>
                <option value="詮達">詮達</option>
                <!-- 您可以在這裡新增更多廠商 -->
            </select>

            <label for="workerCount">施工人數：</label>
            <select id="workerCount" required>
                <option value="" disabled selected>請選擇人數 ▼</option>
                <option value="1人">1人</option>
                <option value="2人">2人</option>
                <option value="3人">3人</option>
                <option value="4人">4人</option>
                <option value="5人">5人</option>
                <option value="6人">6人</option>
                <option value="7人">7人</option>
                <option value="8人">8人</option>
                <option value="9人">9人</option>
                <option value="10人以上">10人以上</option>
            </select>

            <label for="progress">今日作業進度：</label>
            <textarea id="progress" rows="3" placeholder="例如：鷹架拆除作業完成" required></textarea>

            <label for="remarks">備註：</label>
            <textarea id="remarks" rows="2" placeholder="無則免填"></textarea>

            <label for="photo">現場照片上傳：</label>
            <input type="file" id="photo" accept="image/*" multiple required>

            <button type="button" onclick="submitForm()">確認送出並發佈至群組</button>
            <div id="loading">🚀 正在上傳照片，請稍候...</div>
        </form>
    </div>

    <script>
        window.onload = function() {
            liff.init({ liffId: "2011289657-vQgMb0eI" }).then(() => {
                if (!liff.isLoggedIn()) liff.login();
            }).catch(err => console.log(err));
        };

        async function submitForm() {
            const projectName = document.getElementById('projectName').value;
            const temp = document.getElementById('temp').value || '未填寫';
            const humidity = document.getElementById('humidity').value || '未填寫';
            const wind = document.getElementById('wind').value || '未填寫';
            const contractor = document.getElementById('contractor').value;
            const workerCount = document.getElementById('workerCount').value;
            const progress = document.getElementById('progress').value;
            const remarks = document.getElementById('remarks').value || '';
            const photoInput = document.getElementById('photo');

            if (!projectName || !contractor || !workerCount || !progress || photoInput.files.length === 0) {
                alert('請完整填寫下拉選單、作業進度，並至少上傳一張照片！');
                return;
            }

            document.getElementById('loading').style.display = 'block';

            // 1. 準備發送給 OneDrive 的照片資料
            const formData = new FormData();
            formData.append('projectName', projectName); 
            for (let i = 0; i < photoInput.files.length; i++) {
                formData.append('photos', photoInput.files[i]);
            }

            try {
                // 上傳照片到 OneDrive
                const response = await fetch('https://gong-cheng-linechuan-jie.onrender.com/api/submit-report', {
                    method: 'POST',
                    body: formData 
                });

                document.getElementById('loading').style.display = 'none';

                if (response.ok) {
                    // 2. 完美還原您截圖的文字格式！
                    const dateStr = new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' }); // 格式化為 2026/08/28
                    
                    let reportText = `${dateStr}\n\n`;
                    reportText += `溫度：${temp}度\n`;
                    reportText += `濕度：${humidity}%\n`;
                    reportText += `風速：${wind}m/s\n\n`;
                    reportText += `施工廠商：${contractor}\n`;
                    reportText += `施工人數：${workerCount}\n`;
                    reportText += `_____________________\n\n`;
                    reportText += `今日作業進度：\n${progress}\n\n`;
                    reportText += `備註：\n${remarks}\n`;
                    reportText += `_____________________\n`;
                    reportText += `以上為今日進度報告`;

                    // 3. 透過 LIFF 用「純文字」格式發送到群組 (會顯示為綠色泡泡)
                    if (liff.isInClient()) {
                        await liff.sendMessages([{
                            type: "text",
                            text: reportText
                        }]);
                    }

                    alert('🎉 報告已發布，照片已存入 OneDrive！');
                    liff.closeWindow(); 
                } else {
                    const result = await response.json();
                    alert('上傳失敗：' + (result.error || '未知錯誤'));
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                alert('連線錯誤，請檢查網路。');
            }
        }
    </script>
</body>
</html>
