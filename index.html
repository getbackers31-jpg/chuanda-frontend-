<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云說工程 - 施工日報表</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 15px; color: #333; }
        .container { background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h2 { text-align: center; color: #00B900; margin-top: 0; font-size: 22px; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; color: #444; }
        select, textarea, input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; background-color: #fafafa; margin-bottom: 5px; }
        .flex-row { display: flex; gap: 10px; }
        .flex-row input { width: 33%; }
        .btn-weather { background-color: #17a2b8; color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; font-size: 14px; width: 100%; margin-bottom: 10px; }
        button.submit-btn { width: 100%; background-color: #00B900; color: white; border: none; padding: 12px; font-size: 18px; border-radius: 5px; margin-top: 20px; cursor: pointer; font-weight: bold; }
        button:active { opacity: 0.8; }
        #loading { display: none; text-align: center; color: #00B900; margin-top: 15px; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>👷‍♂️ 施工日報表</h2>
        <form id="dailyReportForm">
            
            <!-- 案場 (支援記憶) -->
            <label>案場位置：</label>
            <select id="projectName" onchange="toggleCustom('projectName', 'customProject')" required>
                <option value="" disabled selected>請選擇目前施工的案場 ▼</option>
                <option value="custom">➕ 新增自訂案場...</option>
            </select>
            <input type="text" id="customProject" class="hidden" placeholder="請輸入新案場名稱 (將自動記憶)">

            <!-- 自動氣象 -->
            <label>氣象資訊：</label>
            <button type="button" class="btn-weather" onclick="getWeather()">🌤️ 一鍵獲取當地天氣</button>
            <div class="flex-row">
                <input type="text" id="temp" placeholder="溫度(度)">
                <input type="text" id="humidity" placeholder="濕度(%)">
                <input type="text" id="wind" placeholder="風速(m/s)">
            </div>

            <!-- 廠商 (支援記憶) -->
            <label>施工廠商：</label>
            <select id="contractor" onchange="toggleCustom('contractor', 'customContractor')" required>
                <option value="" disabled selected>請選擇廠商 ▼</option>
                <option value="容煜">容煜</option>
                <option value="詮達">詮達</option>
                <option value="custom">➕ 新增自訂廠商...</option>
            </select>
            <input type="text" id="customContractor" class="hidden" placeholder="請輸入新廠商名稱 (將自動記憶)">

            <!-- 人數 -->
            <label>施工人數：</label>
            <select id="workerCount" required>
                <option value="" disabled selected>請選擇人數 ▼</option>
                <option value="1人">1人</option><option value="2人">2人</option><option value="3人">3人</option>
                <option value="4人">4人</option><option value="5人">5人</option><option value="6人">6人</option>
                <option value="7人">7人</option><option value="8人">8人</option><option value="9人">9人</option>
                <option value="10人以上">10人以上</option>
            </select>

            <!-- 進度與用料 -->
            <label>今日作業進度：</label>
            <textarea id="progress" rows="2" placeholder="例如：鷹架拆除作業完成" required></textarea>

            <label>今日用料：</label>
            <textarea id="materials" rows="2" placeholder="常規用料填寫處" required></textarea>

            <label>其他 (意外用料/備註)：</label>
            <textarea id="remarks" rows="2" placeholder="無則免填"></textarea>

            <!-- 照片 -->
            <label>現場照片上傳 (建議10張以內)：</label>
            <input type="file" id="photo" accept="image/*" multiple required>

            <button type="button" class="submit-btn" onclick="submitForm()">確認送出並發佈至群組</button>
            <div id="loading">🚀 正在上傳照片，請稍候...</div>
        </form>
    </div>

    <script>
        // 頁面載入時，讀取記憶的選項
        window.onload = function() {
            liff.init({ liffId: "2011289657-vQgMb0eI" }).then(() => {
                if (!liff.isLoggedIn()) liff.login();
            }).catch(err => console.log(err));
            
            loadSavedOptions('projectName', 'savedProjects');
            loadSavedOptions('contractor', 'savedContractors');
        };

        // 控制自訂輸入框的顯示
        function toggleCustom(selectId, inputId) {
            const select = document.getElementById(selectId);
            const input = document.getElementById(inputId);
            if (select.value === 'custom') {
                input.style.display = 'block';
                input.focus();
            } else {
                input.style.display = 'none';
            }
        }

        // 載入儲存在手機裡的選項
        function loadSavedOptions(selectId, storageKey) {
            const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
            const select = document.getElementById(selectId);
            saved.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item; opt.text = item;
                select.add(opt, select.options[select.options.length - 1]); // 插入在"新增自訂"的前面
            });
        }

        // 儲存新選項到手機裡
        function saveNewOption(storageKey, newValue) {
            let saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
            if (!saved.includes(newValue)) {
                saved.push(newValue);
                localStorage.setItem(storageKey, JSON.stringify(saved));
            }
        }

        // 一鍵獲取天氣
        function getWeather() {
            if (navigator.geolocation) {
                document.getElementById('temp').value = "讀取中...";
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    try {
                        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m`);
                        const data = await res.json();
                        document.getElementById('temp').value = data.current.temperature_2m;
                        document.getElementById('humidity').value = data.current.relative_humidity_2m;
                        document.getElementById('wind').value = data.current.wind_speed_10m;
                    } catch (e) {
                        alert("氣象抓取失敗，請手動輸入");
                        document.getElementById('temp').value = "";
                    }
                }, () => { alert("請允許網頁取用位置，或手動輸入氣象"); });
            }
        }

        // 提交表單
        async function submitForm() {
            let projectName = document.getElementById('projectName').value;
            if (projectName === 'custom') {
                projectName = document.getElementById('customProject').value;
                if(projectName) saveNewOption('savedProjects', projectName);
            }

            let contractor = document.getElementById('contractor').value;
            if (contractor === 'custom') {
                contractor = document.getElementById('customContractor').value;
                if(contractor) saveNewOption('savedContractors', contractor);
            }

            const temp = document.getElementById('temp').value || '未填寫';
            const humidity = document.getElementById('humidity').value || '未填寫';
            const wind = document.getElementById('wind').value || '未填寫';
            const workerCount = document.getElementById('workerCount').value;
            const progress = document.getElementById('progress').value;
            const materials = document.getElementById('materials').value;
            const remarks = document.getElementById('remarks').value || '無';
            const photoInput = document.getElementById('photo');

            if (!projectName || !contractor || !workerCount || !progress || !materials || photoInput.files.length === 0) {
                alert('請完整填寫必填欄位，並至少上傳一張照片！');
                return;
            }

            if (photoInput.files.length > 20) {
                alert('⚠️ 為了避免上傳失敗，一次請勿選擇超過 20 張照片。大量照片請傳至 LINE 群組相簿！');
                return;
            }

            document.getElementById('loading').style.display = 'block';

            const formData = new FormData();
            formData.append('projectName', projectName); 
            for (let i = 0; i < photoInput.files.length; i++) {
                formData.append('photos', photoInput.files[i]);
            }

            try {
                const response = await fetch('https://gong-cheng-linechuan-jie.onrender.com/api/submit-report', {
                    method: 'POST', body: formData 
                });

                document.getElementById('loading').style.display = 'none';

                if (response.ok) {
                    const dateStr = new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' });
                    
                    let reportText = `${dateStr}\n\n`;
                    reportText += `溫度：${temp}度\n`;
                    reportText += `濕度：${humidity}%\n`;
                    reportText += `風速：${wind}m/s\n\n`;
                    reportText += `施工廠商：${contractor}\n`;
                    reportText += `施工人數：${workerCount}\n`;
                    reportText += `_____________________\n\n`;
                    reportText += `今日作業進度：\n${progress}\n\n`;
                    reportText += `今日用料：\n${materials}\n\n`;
                    reportText += `其他/備註：\n${remarks}\n`;
                    reportText += `_____________________\n`;
                    reportText += `以上為今日進度報告`;

                    if (liff.isInClient()) {
                        await liff.sendMessages([{ type: "text", text: reportText }]);
                    }
                    alert('🎉 報告已發布，照片已存入 OneDrive！');
                    liff.closeWindow(); 
                } else {
                    const result = await response.json();
                    alert('上傳失敗：' + (result.error || '未知錯誤'));
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                alert('連線錯誤，請檢查網路。');
            }
        }
    </script>
</body>
</html>
