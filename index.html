<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>詮達工程 - 施工日報表</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h2 { text-align: center; color: #00B900; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; }
        /* 這裡加入了 select 的樣式 */
        select, textarea, input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; background-color: #00B900; color: white; border: none; padding: 12px; font-size: 18px; border-radius: 5px; margin-top: 20px; cursor: pointer; }
        button:active { background-color: #009900; }
        #loading { display: none; text-align: center; color: #666; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>👷‍♂️ 詮達施工日報表</h2>
        <form id="dailyReportForm">
            <label for="projectName">工程名稱 / 案場位置：</label>
            <!-- 🎯 這裡改成了下拉選單，您可以自行修改裡面的 option -->
            <select id="projectName" required>
                <option value="" disabled selected>請選擇目前施工的案場 ▼</option>
                <option value="信義區 A 案場">信義區 A 案場</option>
                <option value="忠孝東路 B 裝修案">忠孝東路 B 裝修案</option>
                <option value="內湖科學園區 C 專案">內湖科學園區 C 專案</option>
                <option value="其他 (臨時修繕)">其他 (臨時修繕)</option>
            </select>

            <label for="materials">今日用料與施工進度：</label>
            <textarea id="materials" rows="4" placeholder="例如：完成 A 區配線、使用水管 5 支..." required></textarea>

            <label for="photo">現場照片上傳 (可選多張)：</label>
            <input type="file" id="photo" accept="image/*" multiple required>

            <button type="button" onclick="submitForm()">確認送出</button>
            <div id="loading">🚀 正在上傳照片並發送日報，請稍候...</div>
        </form>
    </div>

    <script>
        window.onload = function() {
            liff.init({ liffId: "2011289657-vQgMb0eI" }).then(() => {
                if (!liff.isLoggedIn()) liff.login();
            }).catch(err => console.log(err));
        };

        async function submitForm() {
            const projectName = document.getElementById('projectName').value;
            const materials = document.getElementById('materials').value;
            const photoInput = document.getElementById('photo');

            if (!projectName || !materials || photoInput.files.length === 0) {
                alert('請選擇案場、填寫進度，並至少上傳一張照片！');
                return;
            }

            document.getElementById('loading').style.display = 'block';

            let userId = "詮達工程師傅";
            try {
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    userId = profile.displayName; 
                }
            } catch (e) { console.log(e); }

            const formData = new FormData();
            formData.append('workerName', userId);
            formData.append('projectName', projectName);
            formData.append('content', materials);
            formData.append('date', new Date().toLocaleString());

            for (let i = 0; i < photoInput.files.length; i++) {
                formData.append('photos', photoInput.files[i]);
            }

            try {
                // 1. 上傳照片到 OneDrive
                const response = await fetch('https://gong-cheng-linechuan-jie.onrender.com/api/submit-report', {
                    method: 'POST',
                    body: formData 
                });

                document.getElementById('loading').style.display = 'none';

                if (response.ok) {
                    // 2. 準備漂亮的 LINE 彈性字卡 (Flex Message)
                    const flexCard = {
                        type: "flex",
                        altText: `${projectName} - 施工日報表`,
                        contents: {
                            type: "bubble",
                            size: "mega",
                            body: {
                                type: "box",
                                layout: "vertical",
                                contents: [
                                    { type: "text", text: "👷‍♂️ 施工日報表", weight: "bold", color: "#00B900", size: "xl" },
                                    { type: "separator", margin: "md" },
                                    { type: "text", text: `📌 案場：${projectName}`, margin: "md", weight: "bold", size: "md", color: "#333333" },
                                    { type: "text", text: `👨‍🔧 師傅：${userId}`, margin: "sm", size: "sm", color: "#666666" },
                                    { type: "text", text: "📝 進度與用料：", margin: "lg", size: "sm", color: "#aaaaaa" },
                                    { type: "text", text: materials, margin: "sm", size: "md", color: "#333333", wrap: true }
                                ]
                            }
                        }
                    };

                    // 3. 透過 LIFF 將字卡傳送到目前的群組
                    if (liff.isInClient()) {
                        await liff.sendMessages([flexCard]);
                    }

                    alert('🎉 日報已成功發送至群組，照片已上傳 OneDrive！');
                    liff.closeWindow(); // 發送完自動關閉畫面
                } else {
                    const result = await response.json();
                    alert('上傳失敗：' + (result.error || '未知錯誤'));
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                alert('連線錯誤，請稍後再試。');
            }
        }
    </script>
</body>
</html>
