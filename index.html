<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云說工程 - 施工日報表</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h2 { text-align: center; color: #00B900; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; }
        input[type="text"], textarea, input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; background-color: #00B900; color: white; border: none; padding: 12px; font-size: 18px; border-radius: 5px; margin-top: 20px; cursor: pointer; }
        button:active { background-color: #009900; }
        #loading { display: none; text-align: center; color: #666; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>👷‍♂️ 云說施工日報表</h2>
        <form id="dailyReportForm">
            <label for="projectName">工程名稱 / 案場位置：</label>
            <input type="text" id="projectName" placeholder="請輸入案場名稱" required>

            <label for="materials">今日用料與施工進度：</label>
            <textarea id="materials" rows="4" placeholder="例如：完成 A 區配線..." required></textarea>

            <label for="photo">現場照片上傳 (可選多張)：</label>
            <!-- 這裡去掉了相機限制，改成可選多張檔案 -->
            <input type="file" id="photo" accept="image/*" multiple>

            <button type="button" onclick="submitForm()">確認送出至雲端</button>
            <div id="loading">正在傳送資料與照片至 OneDrive，請稍候...</div>
        </form>
    </div>

    <script>
        // 1. 初始化 LIFF
        window.onload = function() {
            liff.init({ liffId: "2011289657-vQgMb0eI" }).then(() => {
                if (!liff.isLoggedIn()) liff.login();
            }).catch(err => console.log(err));
        };

        // 2. 提交表單
        async function submitForm() {
            const projectName = document.getElementById('projectName').value;
            const materials = document.getElementById('materials').value;
            const photoInput = document.getElementById('photo');

            if (!projectName || !materials) {
                alert('請填寫工程名稱與今日用料內容！');
                return;
            }

            document.getElementById('loading').style.display = 'block';

            // 抓取 LINE 名稱
            let userId = "未知師傅";
            try {
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    userId = profile.displayName; 
                }
            } catch (e) { console.log(e); }

            // 3. 把文字和「多張照片」打包成 FormData
            const formData = new FormData();
            formData.append('workerName', userId);
            formData.append('projectName', projectName);
            formData.append('content', materials);
            formData.append('date', new Date().toLocaleString());

            // 將使用者選取的照片逐一放入圖文包
            for (let i = 0; i < photoInput.files.length; i++) {
                formData.append('photos', photoInput.files[i]);
            }

            try {
                // 發送到後端
                const response = await fetch('https://gong-cheng-linechuan-jie.onrender.com/api/submit-report', {
                    method: 'POST',
                    body: formData // 注意：使用 FormData 絕對不能自己加 headers
                });

                const result = await response.json();
                document.getElementById('loading').style.display = 'none';

                if (response.ok) {
                    alert('🎉 日報與照片已成功上傳！');
                    document.getElementById('dailyReportForm').reset();
                } else {
                    alert('上傳失敗：' + (result.error || '未知錯誤'));
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                alert('連線錯誤，請稍後再試。');
            }
        }
    </script>
</body>
</html>
